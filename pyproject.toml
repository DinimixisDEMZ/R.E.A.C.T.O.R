[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reactor"
version = "1.2"
description = "Herramienta de gestión y benchmarking para schedulers sched-ext (SCX)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "REACTOR Contributors" },
]
keywords = ["scheduler", "benchmark", "scx", "linux", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Operating System Kernels :: Linux",
]

dependencies = [
    "PyGObject>=3.50",
    "pycairo>=1.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
reactor = "main:main"

[project.gui-scripts]
reactor = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "ui*", "utils*", "widgets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (readability tradeoff)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "utils", "widgets"]
