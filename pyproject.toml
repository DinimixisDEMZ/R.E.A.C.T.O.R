[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reactor"
dynamic = ["version"]
description = "Herramienta de gestión y benchmarking para schedulers sched-ext (SCX)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "REACTOR Contributors" },
]
keywords = ["scheduler", "benchmark", "scx", "linux", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Operating System Kernels :: Linux",
]

dependencies = [
    "PyGObject>=3.50",
    "pycairo>=1.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
reactor = "main:main"

[tool.setuptools.dynamic]
version = {attr = "core.constantes.VERSION"}

[tool.setuptools.packages.find]
include = ["core*", "ui*", "utils*", "widgets*"]

# `main.py` y `app.py` viven en la raíz, no dentro de un paquete. Sin declararlos
# aquí no entraban en el wheel, así que `pip install .` instalaba el punto de
# entrada `reactor` y ese punto de entrada no podía importar `main`.
[tool.setuptools]
py-modules = ["main", "app"]

[tool.setuptools.data-files]
"share/reactor/data/icons" = ["data/icons/reactor.gresource"]
"share/applications" = ["appimage/R.E.A.C.T.O.R.desktop"]
"share/icons/hicolor/scalable/apps" = ["appimage/reactor.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (readability tradeoff)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "utils", "widgets"]
