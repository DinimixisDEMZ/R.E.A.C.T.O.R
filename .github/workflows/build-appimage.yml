name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 \
            python3-pip \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            wget squashfs-tools

      - name: Determinar versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"

      - name: Ejecutar build
        env:
          ARCH: x86_64
        run: bash scripts/build-appimage.sh

      - name: Renombrar AppImage con versión
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv R.E.A.C.T.O.R-x86_64.AppImage "R.E.A.C.T.O.R-$VERSION-x86_64.AppImage"

      - name: Subir AppImage como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: R.E.A.C.T.O.R-${{ steps.version.outputs.VERSION }}
          path: R.E.A.C.T.O.R-*.AppImage

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES="AppImage para R.E.A.C.T.O.R v${VERSION}

          **Requiere en el sistema:** Python 3, GTK 4, libadwaita, scxctl, stress-ng, hyperfine"
          gh release create "v$VERSION" \
            --title "R.E.A.C.T.O.R v$VERSION" \
            --notes "$NOTES" \
            R.E.A.C.T.O.R-*.AppImage
